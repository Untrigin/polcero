# nginx reverse proxy for the POLCERO Astro/Node standalone server.
# The Node app (systemd: polcero.service) listens on 127.0.0.1:4321.
#
#   sudo cp deploy/nginx-polcero.conf /etc/nginx/sites-available/polcero.conf
#   sudo ln -s /etc/nginx/sites-available/polcero.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name polcero.com www.polcero.com;

    # --- Legacy locale redirects -----------------------------------------
    # English is now served at "/". The old "/en/..." tree is gone -> 301.
    location = /en  { return 301 /; }
    location = /en/ { return 301 /; }
    location ^~ /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    # www -> apex (optional; drop if you prefer www as canonical)
    if ($host = www.polcero.com) { return 301 https://polcero.com$request_uri; }

    location / {
        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
